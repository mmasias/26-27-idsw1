<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="554px" preserveAspectRatio="none" style="width:908px;height:554px;background:#FFFFFF;" version="1.1" viewBox="0 0 908 554" width="908px" zoomAndPan="magnify"><title>Estados del sistema corregido</title><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="206.2197" x="344.3135" y="23.5625">Estados del sistema corregido</text><rect fill="#F1F1F1" height="40" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="62.124" x="526.5" y="140.9395"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="52.124" x="531.5" y="166.0322">Inactivo</text><rect fill="#F1F1F1" height="40" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="66.2461" x="412.5" y="274.9395"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="56.2461" x="417.5" y="300.0322">EnCurso</text><rect fill="#F1F1F1" height="40" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="77.1289" x="333" y="409.4395"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="67.1289" x="338" y="434.5322">Finalizado</text><ellipse cx="557.5" cy="53.9395" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1.0;"/><ellipse cx="577.5" cy="537.9395" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1.0;"/><ellipse cx="577.5" cy="537.9395" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1.0;"/><g id="elem_GMN15"><path d="M623.5,147.9395 L623.5,156.9395 L588.73,160.9395 L623.5,164.9395 L623.5,173.6689 A0,0 0 0 0 623.5,173.6689 L901.8467,173.6689 A0,0 0 0 0 901.8467,173.6689 L901.8467,157.9395 L891.8467,147.9395 L623.5,147.9395 A0,0 0 0 0 623.5,147.9395 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M891.8467,147.9395 L891.8467,157.9395 L901.8467,157.9395 L891.8467,147.9395 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="257.3467" x="629.5" y="165.5332">salirDelSistema() cierra el sistema (RQ-3).</text></g><g id="elem_GMN18"><path d="M6,266.4395 L6,323.6279 A0,0 0 0 0 6,323.6279 L376.5083,323.6279 A0,0 0 0 0 376.5083,323.6279 L376.5083,298.9395 L412.34,294.9395 L376.5083,290.9395 L376.5083,276.4395 L366.5083,266.4395 L6,266.4395 A0,0 0 0 0 6,266.4395 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M366.5083,266.4395 L366.5083,276.4395 L376.5083,276.4395 L366.5083,266.4395 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="349.5083" x="12" y="284.0332">bajarPieza() sustituye a alternarVelocidadCaida() (DD-7).</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="294.2773" x="12" y="299.7627">abandonarPartida() sustituye a reiniciarPartida()</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="298.6826" x="12" y="315.4922">y ahora aparece en este diagrama (RQ-2, DD-8).</text></g><g id="elem_GMN21"><path d="M445,408.9395 L445,425.4395 L410.31,429.4395 L445,433.4395 L445,450.3984 A0,0 0 0 0 445,450.3984 L730.3926,450.3984 A0,0 0 0 0 730.3926,450.3984 L730.3926,418.9395 L720.3926,408.9395 L445,408.9395 A0,0 0 0 0 445,408.9395 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M720.3926,408.9395 L720.3926,418.9395 L730.3926,418.9395 L720.3926,408.9395 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="264.3926" x="451" y="426.5332">Tras perder se puede empezar otra partida</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="239.9541" x="451" y="442.2627">directamente, sin confirmaci&#243;n (DD-8).</text></g><!--link *start* to Inactivo--><g id="link_*start*_Inactivo"><path d="M557.5,64.2595 C557.5,81.3195 557.5,111.9195 557.5,134.5795 " fill="none" id="*start*-to-Inactivo" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="557.5,140.5795,561.5,131.5795,557.5,135.5795,553.5,131.5795,557.5,140.5795" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="110.043" x="558.5" y="107.5332">arrancarSistema()</text></g><!--link Inactivo to EnCurso--><g id="link_Inactivo_EnCurso"><path d="M526.45,163.5395 C494.63,167.0295 446.63,177.8495 423.5,210.9395 C410.09,230.1195 418.3113,251.8455 429.0713,269.7655 " fill="none" id="Inactivo-to-EnCurso" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="432.16,274.9095,430.9563,265.1344,429.5861,270.6228,424.0977,269.2526,432.16,274.9095" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="89.3877" x="424.5" y="224.5332">iniciarPartida()</text></g><!--link EnCurso to Inactivo--><g id="link_EnCurso_Inactivo"><path d="M470.25,274.7795 C485.27,262.4095 504.24,245.4095 518.5,227.9395 C530.37,213.3995 538.2157,200.1795 545.3757,186.4495 " fill="none" id="EnCurso-to-Inactivo" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="548.15,181.1295,540.4418,187.26,545.8381,185.5628,547.5352,190.9591,548.15,181.1295" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="201.8491" x="532.5" y="224.5332">abandonarPartida() [confirmado]</text></g><!--link Inactivo to *end*--><g id="link_Inactivo_*end*"><path d="M588.74,175.1495 C594.27,177.2395 600.01,179.2695 605.5,180.9395 C665.12,199.1395 702.81,162.8795 742.5,210.939