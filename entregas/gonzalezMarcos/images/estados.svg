<?plantuml 1.2026.1?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="613px" preserveAspectRatio="none" style="width:731px;height:613px;background:#FFFFFF;" version="1.1" viewBox="0 0 731 613" width="731px" zoomAndPan="magnify"><title>Estados del sistema</title><defs/><g><g class="title" data-source-line="11"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="143.6914" x="286.8134" y="23.5352">Estados del sistema</text></g><rect fill="#F3F7FC" height="40" rx="12.5" ry="12.5" style="stroke:#374151;stroke-width:0.5;" width="86.1563" x="427.48" y="141.4883"/><text fill="#000000" font-family="sans-serif" font-size="16" lengthAdjust="spacing" textLength="76.1563" x="432.48" y="167.5352">INACTIVO</text><rect fill="#F3F7FC" height="40" rx="12.5" ry="12.5" style="stroke:#374151;stroke-width:0.5;" width="91.8125" x="285.65" y="293.9883"/><text fill="#000000" font-family="sans-serif" font-size="16" lengthAdjust="spacing" textLength="81.8125" x="290.65" y="320.0352">EN_CURSO</text><rect fill="#F3F7FC" height="40" rx="12.5" ry="12.5" style="stroke:#374151;stroke-width:0.5;" width="104.3125" x="441.4" y="446.4883"/><text fill="#000000" font-family="sans-serif" font-size="16" lengthAdjust="spacing" textLength="94.3125" x="446.4" y="472.5352">FINALIZADO</text><ellipse cx="470.56" cy="53.4883" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><g class="entity" data-qualified-name="GMN2" data-source-line="25" id="ent0003"><path d="M6,292.4983 L6,335.4748 A0,0 0 0 0 6,335.4748 L251.1162,335.4748 A0,0 0 0 0 251.1162,335.4748 L251.1162,317.9883 L285.26,313.9883 L251.1162,309.9883 L251.1162,302.4983 L241.1162,292.4983 L6,292.4983 A0,0 0 0 0 6,292.4983" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M241.1162,292.4983 L241.1162,302.4983 L251.1162,302.4983 L241.1162,292.4983" fill="#FEFFDD" s