<?plantuml 1.2026.1?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="636px" preserveAspectRatio="none" style="width:524px;height:636px;background:#FFFFFF;" version="1.1" viewBox="0 0 524 636" width="524px" zoomAndPan="magnify"><title>Estados del sistema: propuesta</title><defs/><g><g class="title" data-source-line="9"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="224.8408" x="142.9502" y="23.5352">Estados del sistema: propuesta</text></g><rect fill="#F3F7FC" height="40" rx="12.5" ry="12.5" style="stroke:#374151;stroke-width:0.5;" width="76.6367" x="141.47" y="191.7283"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="66.6367" x="146.47" y="217.0193">INACTIVO</text><rect fill="#F3F7FC" height="40" rx="12.5" ry="12.5" style="stroke:#374151;stroke-width:0.5;" width="81.5859" x="7" y="332.2283"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="71.5859" x="12" y="357.5193">EN_CURSO</text><rect fill="#F3F7FC" height="40" rx="12.5" ry="12.5" style="stroke:#374151;stroke-width:0.5;" width="92.5234" x="205.53" y="472.7283"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="82.5234" x="210.53" y="498.0193">FINALIZADO</text><ellipse cx="97.79" cy="79.1083" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><g class="entity" data-qualified-name="GMN2" data-source-line="23" id="ent0003"><path d="M142.72,43.4883 L142.72,114.7305 L380.8733,114.7305 L380.8733,53.4883 L370.8733,43.4883 L142.72,43.4883" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M370.8733,43.4883 L370.8733,53.4883 L380.8733,53.4883 L370.8733,43.4883" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="217.1533" x="148.72" y="61.0566">El diagrama resume los resultados</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="127.5435" x="148.72" y="76.3672">de los casos de uso.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="208.1079" x="148.72" y="91.6777">Un movimiento o giro bloqueado</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="186.0498" x="148.72" y="106.9883">tambi&#233;n conserva EN_CURSO.</text></g><g class="entity" data-qualified-name="GMN5" data-source-line="30" id="ent0006"><path d="M77.53,573.7283 L77.53,629.6599 A0,0 0 0 0 77.53,629.6599 L426.0627,629.6599 A0,0 0 0 0 426.0627,629.6599 L426.0627,583.7283 L416.0627,573.7283 L255.79,573.7283 L251.79,512.8483 L247.79,573.7283 L77.53,573.7283 A0,0 0 0 0 77.53,573.7283" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M416.0627,573.7283 L416.0627,583.7283 L426.0627,583.7283 L416.0627,573.7283" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="309.645" x="83.53" y="591.2966">Cancelar el reinicio conserva el estado de origen.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="272.3525" x="83.53" y="606.6072">Mientras se confirma, la partida no avanza.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="327.5327" x="83.53" y="621.9177">FINALIZADO es fin de partida, no cierre del sistema.</text></g><!--link *start* to INACTIVO--><g class="link" data-entity-1="ent0002" data-entity-2="ent0002" data-link-type="dependency" data-source-line="15" id="lnk3"><path d="M99.23,89.3583 C102.05,105.2483 109.39,138.2783 124.79,161.7283 C132.17,172.9483 138.1154,179.3855 148.0354,187.5855" fill="none" id="*start*-to-INACTIVO" style