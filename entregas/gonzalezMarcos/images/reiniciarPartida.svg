<?plantuml 1.2026.1?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="606px" preserveAspectRatio="none" style="width:877px;height:606px;background:#FFFFFF;" version="1.1" viewBox="0 0 877 606" width="877px" zoomAndPan="magnify"><title>Reiniciar una partida</title><defs/><g><g class="title" data-source-line="11"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="150.2129" x="356.4131" y="23.5352">Reiniciar una partida</text></g><rect fill="#F3F7FC" height="40" rx="12.5" ry="12.5" style="stroke:#374151;stroke-width:0.5;" width="91.8125" x="309.61" y="44.4883"/><text fill="#000000" font-family="sans-serif" font-size="16" lengthAdjust="spacing" textLength="81.8125" x="314.61" y="70.5352">EN_CURSO</text><rect fill="#F3F7FC" height="40" rx="12.5" ry="12.5" style="stroke:#374151;stroke-width:0.5;" width="104.3125" x="452.36" y="44.4883"/><text fill="#000000" font-family="sans-serif" font-size="16" lengthAdjust="spacing" textLength="94.3125" x="457.36" y="70.5352">FINALIZADO</text><g><rect fill="#F3F7FC" height="95.375" rx="12.5" ry="12.5" style="stroke:#374151;stroke-width:0.5;" width="326.5313" x="266.25" y="178.4883"/><line style="stroke:#374151;stroke-width:0.5;" x1="266.25" x2="592.7813" y1="207.332" y2="207.332"/><text fill="#000000" font-family="sans-serif" font-size="16" lengthAdjust="spacing" textLength="104.2344" x="377.3984" y="198.957">Confirmaci&#243;n</text><text fill="#000000" font-family="sans-serif" font-size="16" lengthAdjust="spacing" textLength="262.4922" x="271.25" y="227.8008">Sistema presenta la confirmaci&#243;n.</text><text fill="#000000" font-family="sans-serif" font-size="16" lengthAdjust="spacing" textLength="294.6094" x="271.25" y="246.6445">Sistema permite confirmar o cancelar.</text><text fill="#000000" font-family="sans-serif" font-size="16" lengthAdjust="spacing" textLength="306.5313" x="271.25" y="265.4883">La partida no avanza durante la espera.</text></g><g class="entity" data-qualified-name="Respuesta" id="ent0005"><polygon fill="#F1F1F1" points="429.52,367.8583,441.52,379.8583,429.52,391.8583,417.52,379.8583,429.52,367.8583" style="stroke:#181818;stroke-width:0.5;"/></g><g><rect fill="#F3F7FC" height="76.5313" rx="12.5" ry="12.5" style="stroke:#374151;stroke-width:0.5;" width="231.0391" x="7" y="504.6983"/><line style="stroke:#374151;stroke-width:0.5;" x1="7" x2="238.0391" y1="533.542" y2="533.542"/><text fill="#000000" font-family="sans-serif" font-size="16" lengthAdjust="spacing" textLength="81.8125" x="81.6133" y="525.167">EN_CURSO</text><text fill="#000000" font-family="sans-serif" font-size="16" lengthAdjust="spacing" textLength="211.0391" x="12" y="554.0108">Sistema presenta la partida</text><text fill="#000000" font-family="sans-serif" font-size="16" lengthAdjust="spacing" textLength="97.4844" x="12" y="572.8545">sin cambios.</text></g><g><rect fill="#F3F7FC" height="114.2188" rx="12.5" ry="12.5" style="stroke:#374151;stroke-width:0.5;" width="312.2109" x="273.41" y="485.8583"/><line style="stroke:#374151;stroke-width:0.5;" x1="273.41" x2="585.6209" y1="514.702" y2="514.702"/><text fill="#000000" font-family="sans-serif" font-size="16" lengthAdjust="spacing" textLength="76.1563" x="391.4373" y="506.327">INACTIVO</text><text fill="#000000" font-family="sans-serif" font-size="16" lengthAdjust="spacing" textLength="273.3984" x="278.41" y="535.1708">Sistema presenta la pantalla inicial,</text><text fill="#000000" font-family="sans-serif" font-size="16" lengthAdjust="spacing" textLength="210.5469" x="278.41" y="554.0145">sin pieza activa ni bloques,</text><text fill="#000000" font-family="sans-serif" font-size="16" lengthAdjust="spacing" textLength="292.2109" x="278.41" y="572.8583">con puntuaci&#243;n 0 y velocidad normal.</text><text fill="#000000" font-family="sans-serif" font-size="16" lengthAdjust="spacing" textLength="242.6641" x="2